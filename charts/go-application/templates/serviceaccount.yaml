{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "common.annotations.merge" (list . .Values.serviceAccount.annotations) | indent 2 }}
  labels:
    {{- include "common.labels" (dict "context" .) | nindent 4 }}
  name: {{ include "common.serviceAccountName" . }}
{{- end }}
