name: Release

# Publishes every chart whose version is not in GHCR yet (oci://ghcr.io/<owner>/charts/<name>)
# and tags the commit "<name>-<version>". Already published versions are skipped, never overwritten.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v3.16.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Login GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${ACTOR}" --password-stdin
      - name: Package and push new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          registry="oci://ghcr.io/${owner}/charts"
          mkdir -p dist
          published=0
          for dir in charts/*/; do
            dir="${dir%/}"
            [ -f "${dir}/Chart.yaml" ] || continue
            name=$(awk '/^name:/{print $2}' "${dir}/Chart.yaml")
            version=$(awk '/^version:/{print $2}' "${dir}/Chart.yaml")
            tag="${name}-${version}"

            if helm pull "${registry}/${name}" --version "${version}" --destination /tmp/probe >/dev/null 2>&1; then
              echo "skip ${name} ${version}: already published"
              continue
            fi

            values=()
            [ -f "${dir}/ci/default-values.yaml" ] && values=(-f "${dir}/ci/default-values.yaml")
            helm lint --strict "${dir}" "${values[@]}"
            helm package "${dir}" --destination dist
            helm push "dist/${name}-${version}.tgz" "${registry}"

            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              gh release create "${tag}" "dist/${name}-${version}.tgz" \
                --target "${GITHUB_SHA}" --title "${name} ${version}" --generate-notes
            fi
            published=$((published + 1))
            echo "published ${name} ${version}"
          done
          echo "### Charts published: ${published}" >> "${GITHUB_STEP_SUMMARY}"
