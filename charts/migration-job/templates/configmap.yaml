apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "common.annotations.merge" (list $ .Values.config.annotations) | indent 2 }}
  labels:
    {{- include "common.labels" (dict "context" $) | nindent 4 }}
  name: {{ include "common.name" . }}-{{ .Values.container.image.tag | sha256sum | trunc 8 }}
data:
  {{- range $key, $value := .Values.config.data }}
  {{- include "common.configmap-generator" (dict "key" $key "value" $value) }}
  {{- end }}