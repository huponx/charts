{{- if .Values.secret.data }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "common.annotations.merge" (list . .Values.secret.annotations) | indent 2 }}
  labels:
    {{- include "common.labels" (dict "context" .) | nindent 4 }}
  name: {{ include "common.name" . }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}