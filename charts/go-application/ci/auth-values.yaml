deployment:
  container:
    image:
      repository: huponx/example
      tag: 1.0.0
    volumeMounts:
      - name: caller-token
        mountPath: /var/run/secrets/peer
        readOnly: true
  volumes:
    - name: caller-token
      projected:
        sources:
          - serviceAccountToken:
              audience: peer
              expirationSeconds: 3600
              path: token
serviceAccount:
  create: true
  annotations:
    example.com/owner: platform
rbac:
  authDelegator: true
