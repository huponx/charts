{{- if .Values.config.data }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "common.annotations.merge" (list $ dict) | indent 2 }}
  labels:
    {{- include "common.labels" (dict "context" $) | nindent 4 }}
  name: {{ include "common.name" . }}-env-vars
data:
  {{- range $key, $value := .Values.config.data }}
  {{- include "common.configmap-generator" (dict "key" $key "value" $value) }}
  {{- end }}
{{- end }}